server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth(?<segment>/?.*), /api/v1/auth$\{segment}

        - id: flight-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/flights/**
          filters:
            - RewritePath=/api/flights(?<segment>/?.*), /api/v1/flights$\{segment}

        - id: flight-admin-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/admin/**
          filters:
            - RewritePath=/api/admin(?<segment>/?.*), /api/v1/admin$\{segment}

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/booking/**
          filters:
            - RewritePath=/api/booking(?<segment>/?.*), /api/v1/booking$\{segment}

        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payment/**
          filters:
            - RewritePath=/api/payment(?<segment>/?.*), /api/v1/payment$\{segment}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG